name: Build

# every push and pull request to main, and each Monday: an advisory published after the last push shows on main within a week. The scheduled
# run audits the packages and runs nothing else.
on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
 schedule:
  - cron: '17 6 * * 1'

permissions:
 contents: read

jobs:
 # npm audit checks every package of package-lock.json, the dev dependencies and the transitive ones included, against the registry's advisories of
 # every severity: a vulnerable package fails the run here, before any build, with the package, its versions and its advisory. The fix is a version
 # bump of the package, or an override in package.json that pins the transitive one above the advisory.
 vulnerable-packages:
  runs-on: ubuntu-latest
  timeout-minutes: 10

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
     with:
      node-version: 22

   - name: Vulnerable packages
     run: npm audit --audit-level=low

 build:
  needs: vulnerable-packages
  if: github.event_name != 'schedule'
  # the extension is TypeScript bundled for VS Code's Node: one system builds and packages it for all. The smoke script
  # (npm run smoke) runs in the smoke job, which deploys a released platform first.
  runs-on: ubuntu-latest
  timeout-minutes: 15

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
     with:
      node-version: 22
      cache: npm

   - name: Install
     run: npm ci

   - name: Type check
     run: npm run typecheck

   - name: Build
     run: npm run build

   # the tests, with node's test coverage: lcov.info, through the bundle's source map, of the files in src/ that a test loads.
   - name: Test + coverage
     run: npm run coverage

   # the badge counts every line of src/, as node's coverage counts the lines of a file a test loads. A file no test loads, as
   # src/extension.ts, which needs VS Code's own vscode module, counts with none of its lines covered. The files are written on
   # every run, so a pull request's run shows them; only a push to main publishes them (the badge job).
   - name: Coverage badge
     run: |
       total=0
       hit=0
       for file in $(find src -name '*.ts' | sort); do
         lines=$(awk -v f="SF:$file" '$0 == f {on = 1; next} /^SF:/ {on = 0} on && /^LF:/ {sub("LF:", ""); print; exit}' lcov.info)
         covered=$(awk -v f="SF:$file" '$0 == f {on = 1; next} /^SF:/ {on = 0} on && /^LH:/ {sub("LH:", ""); print; exit}' lcov.info)
         if [ -z "$lines" ]; then
           lines=$(awk 'END {print NR}' "$file")
           covered=0
         fi
         echo "$file: $covered of $lines lines"
         total=$((total + lines))
         hit=$((hit + covered))
       done
       pct=$(awk -v hit="$hit" -v total="$total" 'BEGIN {printf "%.1f", total ? 100 * hit / total : 0}')
       echo "RDCore.VSCode line coverage: ${pct}%"
       mkdir badge
       # a shields.io endpoint file, as the other repositories' badges are.
       badge() {
         n=${2%.*}
         if   [ "$n" -ge 80 ]; then color=brightgreen
         elif [ "$n" -ge 60 ]; then color=green
         elif [ "$n" -ge 40 ]; then color=yellowgreen
         elif [ "$n" -ge 25 ]; then color=yellow
         elif [ "$n" -ge 10 ]; then color=orange
         else color=red
         fi
         printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$2" "$color" > "badge/$1.json"
         echo "$1: $2%"
       }
       badge coverage "$pct"

   - name: Upload coverage badges
     uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
     with:
      name: coverage-badges
      path: badge/*.json
      if-no-files-found: error
      retention-days: 7

   # vsce runs vscode:prepublish first: the type check again, and the production bundle that goes into the package.
   - name: Package
     run: npx vsce package --no-dependencies --out rdcore-vscode.vsix

   - name: Upload the package
     uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
     with:
      name: rdcore-vscode-unsigned
      path: rdcore-vscode.vsix
      if-no-files-found: error
      retention-days: 14

 smoke:
  needs: vulnerable-packages
  if: github.event_name != 'schedule'
  # the smoke script against the latest RDCore release for Linux, which the extension is a client of: the language server
  # answers completion and hover in the sample (scripts/smoke.mjs), and the debug adapter runs it to a conditional breakpoint.
  # The release is framework-dependent: .NET 11 runs it. Its archive is checked against the release's SHA256SUMS before it
  # is unpacked.
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
     with:
      node-version: 22
      cache: npm

   - name: Setup .NET
     uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
     with:
      dotnet-version: 11.0

   - name: Install
     run: npm ci

   - name: Deploy the latest RDCore release
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      tag=$(gh release list --repo rubberduck-vba/RDCore --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
      asset="rdcore-${tag#v}-linux-x64.tar.gz"
      echo "RDCore $tag: $asset"
      mkdir -p "$RUNNER_TEMP/rdcore/platform"
      cd "$RUNNER_TEMP/rdcore"
      gh release download "$tag" --repo rubberduck-vba/RDCore --pattern "$asset" --pattern SHA256SUMS
      grep -F "  $asset" SHA256SUMS | sha256sum --check --strict -
      tar -xzf "$asset" -C platform
      manifest=$(find "$RUNNER_TEMP/rdcore/platform" -name rdcore.json -print -quit)
      test -n "$manifest" || { echo "::error::$asset has no rdcore.json"; exit 1; }
      echo "RDCORE_SMOKE_PLATFORM_ROOT=$(dirname "$manifest")" >> "$GITHUB_ENV"

   - name: Smoke
     run: npm run smoke

 # the only job that can write to the repo: it runs none of the repo's code, just pushes the badge files built above
 badge:
  needs: build
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest
  permissions:
   contents: write

  steps:
   - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
     with:
      name: coverage-badges
      path: badge

   - name: Publish coverage badge
     run: |
       git config --global user.name  'github-actions[bot]'
       git config --global user.email 'github-actions[bot]@users.noreply.github.com'
       tmp=$(mktemp -d)
       cp badge/*.json "$tmp/"
       cd "$tmp"
       git init -q
       git checkout -q -b badges
       git add ./*.json
       git commit -q -m 'coverage badge'
       git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
